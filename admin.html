<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fortune Academy – Admin</title><link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script></head><body>
<header><div style="display:flex;align-items:center;gap:14px"><img src="logo.png" alt="Fortune Academy" style="height:44px"><span>ADMIN</span></div><button id="out" class="gold hide" onclick="signOut()">Log out</button></header><main>
<div id="auth" class="card hide" style="max-width:380px;margin:40px auto"><img src="logo.png" style="height:50px"><h2>Admin Login</h2><label>Email</label><input id="em" type="email"><label>Password</label><input id="pw" type="password"><button class="gold" onclick="signIn('admin',init)">Log in</button></div>
<div id="app" class="hide"><nav><button data-t="st">Students</button><button data-t="gr">Grades</button><button data-t="pr">Programs & Courses</button><button data-t="sw">Swap Requests</button><button data-t="pa">Partners</button><button data-t="fa">Support FAQs</button><button data-t="nt" id="nb">🔔 Notifications</button></nav>
<section id="st" class="tab card"><h2>Students</h2><div id="stl" style="overflow:auto"></div></section>
<section id="gr" class="tab card hide"><h2>Grades</h2><select id="gs" onchange="gload()"></select><div id="gd"></div></section>
<section id="pr" class="tab card hide"><h2>Programs</h2><div class="grid"><div><label>Name</label><input id="pn"></div><div style="grid-column:1/-1"><label>Program outline (start a line with - for bullets)</label><textarea id="po" rows="16"></textarea></div><p style="grid-column:1/-1"><small>Each student's program runs 1 year from their registration date. Start and end dates show automatically to partners.</small></p></div><button class="gold" id="pb" onclick="addProg()">Add program</button><h3>Add a course</h3><label>Program</label><select id="pc"></select><label>Course name</label><input id="cn"><button class="gold" onclick="addCourse()">Add course</button><div id="pl"></div></section>
<section id="sw" class="tab card hide"><h2>Swap requests</h2><div id="swl"></div></section><section id="pa" class="tab card hide"><h2>Partners</h2><div class="card" style="background:#f7f9fc"><h3>Create partner account</h3><div class="grid"><div><label>Organisation</label><input id="no"></div><div><label>Email</label><input id="ne" type="email"></div><div><label>Temporary password (6+ characters)</label><input id="np"></div></div><button class="gold" onclick="newP()">Create partner account</button></div><div id="pal"></div></section><section id="fa" class="tab card hide"><h2>Support FAQs</h2><label>Question</label><input id="fqq"><label>Answer (- for bullets)</label><textarea id="fqa" rows="5"></textarea><button class="gold" onclick="addF()">Add FAQ</button><div id="fal"></div></section><section id="nt" class="tab card hide"><h2>Notifications</h2><button onclick="readAll()">Mark all read</button><div id="ntl"></div></section></div></main>
<script src="config.js"></script><script>
const STAT=['Submitted','Processed','Enrolled','Completed','Rejected'],EX=['Not Started','Scheduled','Passed','Failed'];
let ST=[];login('admin',init);
const opt=(a,v)=>a.map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join('');
function init(){setInterval(notes,30000);$('#out').classList.remove('hide');tabs(()=>{stud();progs();swaps();partners();faqs();notes()})}
async function stud(){const{data}=await sb.from('students').select('*,programs(name),profiles(org)').order('created_at',{ascending:false});ST=data||[];
 $('#stl').innerHTML=`<table><tr><th>Partner</th><th>Name</th><th>Email</th><th>Phone</th><th>ID</th><th>DOB</th><th>Program</th><th>Status</th><th>Final exam</th><th></th></tr>${ST.map(s=>`<tr id="r${s.id}"><td>${esc(s.profiles?.org)}</td>${['name','email','phone','dtc_id','dob'].map(k=>`<td><input data-k="${k}" ${k=='dob'?'type="date"':''} value="${esc(s[k])}"></td>`).join('')}<td>${esc(s.programs?.name)}</td><td><select data-k="status">${opt(STAT,s.status)}</select></td><td><select data-k="final_exam">${opt(EX,s.final_exam)}</select></td><td><button onclick="saveS(${s.id})">Save</button> <button onclick="delS(${s.id})" style="background:#9a1c1c">✕</button></td></tr>`).join('')}</table>`;
 $('#gs').innerHTML=ST.map(s=>`<option value="${s.id}">${esc(s.name)} (${esc(s.dtc_id)})</option>`).join('');gload()}
async function saveS(id){const o={};document.querySelectorAll(`#r${id} [data-k]`).forEach(e=>o[e.dataset.k]=e.value||(e.dataset.k=='dob'?null:''));const{error}=await sb.from('students').update(o).eq('id',id);toast(error?error.message:'Saved')}
async function delS(id){if(confirm('Delete student?')){await sb.from('students').delete().eq('id',id);stud()}}
async function gload(){const s=ST.find(x=>x.id==$('#gs').value);if(!s){$('#gd').innerHTML='';return}
 const[{data:c},{data:g}]=await Promise.all([sb.from('courses').select('*,assessments(*)').eq('program_id',s.program_id),sb.from('grades').select('*').eq('student_id',s.id)]);
 const gm=Object.fromEntries((g||[]).map(x=>[x.assessment_id,x]));
 $('#gd').innerHTML=(c||[]).map(k=>`<h3>${esc(k.name)}</h3><table>${k.assessments.map(a=>`<tr><td>${esc(a.name)}</td><td><input class="sc" data-a="${a.id}" type="number" placeholder="Score /${a.max_score}" value="${gm[a.id]?.score??''}"></td><td><input class="gd" data-a="${a.id}" placeholder="Grade" value="${esc(gm[a.id]?.grade||'')}"></td></tr>`).join('')}</table>`).join('')+'<br><button class="gold" onclick="saveG()">Save grades</button>'}
async function saveG(){const sid=$('#gs').value,rows=[];document.querySelectorAll('.sc').forEach(e=>{const g=document.querySelector(`.gd[data-a="${e.dataset.a}"]`).value;if(e.value!==''||g)rows.push({student_id:sid,assessment_id:e.dataset.a,score:e.value===''?null:e.value,grade:g})});
 const{error}=await sb.from('grades').upsert(rows);toast(error?error.message:'Grades saved')}
let EP=null;
async function addProg(){const o={name:$('#pn').value,outline:$('#po').value};const{error}=EP?await sb.from('programs').update(o).eq('id',EP):await sb.from('programs').insert(o);toast(error?error.message:EP?'Program updated':'Program added');if(!error){EP=null;$('#pb').textContent='Add program';['pn','po'].forEach(i=>$('#'+i).value='')}progs()}
async function addCourse(){if(!$('#cn').value)return toast('Enter course name');const{error}=await sb.from('courses').insert({program_id:$('#pc').value,name:$('#cn').value});toast(error?error.message:'Course added');if(!error){$('#cn').value=''}progs()}
async function progs(){const{data}=await sb.from('programs').select('*,courses(*,assessments(*))').order('id');
 $('#pc').innerHTML=(data||[]).map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');
 $('#pl').innerHTML=(data||[]).map(p=>`<div class="card" style="background:#f7f9fc"><b>${esc(p.name)}</b> <button onclick="editP(${p.id})">Edit</button> <button onclick="addC(${p.id})">+ Course</button><br><div class="ol">${fmt(p.outline)}</div>${p.courses.map(c=>`<p>📘 ${esc(c.name)} —  <button onclick="addA(${c.id})">+ Assessment</button> <button onclick="addQ(${c.id})">+ Bulk quizzes</button> <button onclick="delC(${c.id})" style="background:#9a1c1c">✕</button><br>${c.assessments.map(a=>`<span class="tag">${esc(a.name)} /${a.max_score}</span> `).join('')}</p>`).join('')}</div>`).join('')}
async function addC(id){const n=prompt('Course name');if(!n)return;await sb.from('courses').insert({program_id:id,name:n,outline:prompt('Course outline')||''});progs()}
async function addA(id){const n=prompt('Assessment name');if(!n)return;await sb.from('assessments').insert({course_id:id,name:n,max_score:prompt('Max score','100')||100});progs()}
async function editP(id){const{data:p}=await sb.from('programs').select('*').eq('id',id).single();EP=id;$('#pn').value=p.name;$('#po').value=p.outline||'';$('#pb').textContent='Save changes';$('#pn').scrollIntoView();toast('Edit the form above, then click Save changes')}
async function swaps(){const{data}=await sb.from('swaps').select('*,students(name)').order('created_at',{ascending:false});
 $('#swl').innerHTML=`<table>${(data||[]).map(x=>`<tr><td>${esc(x.students?.name)} → <b>${esc(x.new_name)}</b><br><small>${esc(x.new_email)} ${esc(x.new_phone)}<br>${esc(x.reason)}</small></td><td>${tag(x.status)}</td><td>${x.status=='Pending'?`<button onclick="decide(${x.id},true)">Approve</button> <button onclick="decide(${x.id},false)" style="background:#9a1c1c">Reject</button>`:''}</td></tr>`).join('')}</table>`}
async function decide(id,ok){const{data:x}=await sb.from('swaps').select('*').eq('id',id).single();
 if(ok)await sb.from('students').update({name:x.new_name,email:x.new_email,phone:x.new_phone}).eq('id',x.student_id);
 await sb.from('swaps').update({status:ok?'Approved':'Rejected'}).eq('id',id);swaps()}
async function addQ(id){const n=prompt('Name prefix','Quiz');if(!n)return;const c=+prompt('How many? (e.g. 20)','20');const m=prompt('Max score each','100')||100;if(!c)return;await sb.from('assessments').insert(Array.from({length:c},(_,i)=>({course_id:id,name:n+' '+(i+1),max_score:m})));progs()}
async function delC(id){if(confirm('Delete this course and its assessments/grades?')){await sb.from('courses').delete().eq('id',id);progs()}}
async function partners(){const{data}=await sb.from('profiles').select('*').eq('role','partner').order('org');const{data:st}=await sb.from('students').select('partner_id,status');const cnt=id=>{const a=(st||[]).filter(s=>s.partner_id==id);return a.length+' registered · '+a.filter(s=>s.status=='Enrolled'||s.status=='Completed').length+' enrolled'};
 $('#pal').innerHTML=(data||[]).map(p=>`<div class="acc"><div class="hd" onclick="tg(this)"><span>${p.logo_url?`<img src="${esc(p.logo_url)}" style="height:26px;vertical-align:middle;margin-right:8px">`:''}${esc(p.org)} <small style="font-weight:400;color:#4a5668">· ${cnt(p.id)}</small></span><i>+</i></div><div class="bd" id="pp${p.id}"><div class="grid"><div><label>Organisation</label><input data-k="org" value="${esc(p.org)}"></div><div><label>Contact person</label><input data-k="contact_person" value="${esc(p.contact_person)}"></div><div><label>Contact email</label><input data-k="contact_email" value="${esc(p.contact_email)}"></div><div><label>Phone</label><input data-k="phone" value="${esc(p.phone)}"></div></div><label>Notes</label><textarea data-k="notes">${esc(p.notes)}</textarea><label>Logo (upload to replace)</label><input type="file" accept="image/*"><button class="gold" onclick="saveP('${p.id}')">Save partner</button></div></div>`).join('')||'<p>No partners yet.</p>'}
async function newP(){const t=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false,storageKey:'tmp'}});const{error}=await t.auth.signUp({email:$('#ne').value,password:$('#np').value,options:{data:{org:$('#no').value}}});toast(error?error.message:'Partner account created – share the email and password with them');if(!error){['no','ne','np'].forEach(i=>$('#'+i).value='');setTimeout(partners,800)}}
async function saveP(id){const b=$('#pp'+id),o={};b.querySelectorAll('[data-k]').forEach(e=>o[e.dataset.k]=e.value);const f=b.querySelector('input[type=file]').files[0];if(f){const u=await upLogo(f);if(!u)return;o.logo_url=u}const{error}=await sb.from('profiles').update(o).eq('id',id);toast(error?error.message:'Partner saved');partners()}
async function faqs(){const{data}=await sb.from('faqs').select('*').order('id');$('#fal').innerHTML=(data||[]).map(f=>`<div class="acc"><div class="hd" onclick="tg(this)"><span>${esc(f.question)}</span><i>+</i></div><div class="bd"><div class="ol">${fmt(f.answer)}</div><button onclick="delF(${f.id})" style="background:#9a1c1c">Delete</button></div></div>`).join('')}
async function addF(){const{error}=await sb.from('faqs').insert({question:$('#fqq').value,answer:$('#fqa').value});toast(error?error.message:'FAQ added');if(!error){$('#fqq').value='';$('#fqa').value=''}faqs()}
async function delF(id){await sb.from('faqs').delete().eq('id',id);faqs()}
async function notes(){const{data}=await sb.from('notifications').select('*').order('created_at',{ascending:false}).limit(100);const u=(data||[]).filter(n=>!n.is_read).length;$('#nb').textContent=u?'🔔 Notifications ('+u+')':'🔔 Notifications';
 $('#ntl').innerHTML=(data||[]).map(n=>`<div class="note ${n.is_read?'':'new'}"><div>${esc(n.message)}<br><small>${new Date(n.created_at).toLocaleString()}</small></div>${n.is_read?'':`<button onclick="rd(${n.id})">Mark read</button>`}</div>`).join('')||'<p>No notifications yet.</p>'}
async function rd(id){await sb.from('notifications').update({is_read:true}).eq('id',id);notes()}
async function readAll(){await sb.from('notifications').update({is_read:true}).eq('is_read',false);notes()}
</script></body></html>
