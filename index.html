<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fortune Academy – Partner Portal</title><link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script></head><body>
<header><div style="display:flex;align-items:center;gap:14px"><img src="logo.png" alt="Fortune Academy" style="height:44px"><span>PARTNER PORTAL</span><img id="pl" style="height:36px;display:none"></div><button id="out" class="gold hide" onclick="signOut()">Log out</button></header><main>
<div id="auth" class="card hide" style="max-width:380px;margin:40px auto"><img src="logo.png" style="height:50px"><h2>Partner Login</h2>
<label>Email</label><input id="em" type="email"><label>Password</label><input id="pw" type="password">
<button class="gold" onclick="signIn('partner',init)">Log in</button>
<hr><p><b>New partner?</b> Organisation name</p><input id="org"><button onclick="signup()">Create account</button></div>
<div id="app" class="hide"><nav><button data-t="reg">Register Student</button><button data-t="list">My Students</button><button data-t="prog">Student Progress</button><button data-t="swap">Swap Request</button><button data-t="sup">Support</button></nav>
<section id="reg" class="tab card"><h2>Register a student</h2><form id="f"><div class="grid">
<div><label>Full name</label><input name="name" required></div><div><label>Email</label><input name="email" type="email" required></div>
<div><label>Phone</label><input name="phone" required></div><div><label>DTC ID</label><input name="dtc_id" required></div></div>
<label>Address</label><input name="address" required><label>Program</label><select name="program_id" id="prg" required></select>
<button class="gold">Submit registration</button></form></section>
<section id="list" class="tab card hide"><h2>My students</h2><div id="ls"></div></section>
<section id="prog" class="tab card hide"><h2>Student progress</h2><p><small>Tap + to open a student's full program details.</small></p><div id="pd"></div></section>
<section id="swap" class="tab card hide"><h2>Request a student swap</h2><label>Student to replace</label><select id="ss"></select>
<div class="grid"><div><label>New student name</label><input id="sn"></div><div><label>New email</label><input id="se"></div><div><label>New phone</label><input id="sp"></div></div>
<label>Reason</label><textarea id="sr"></textarea><button class="gold" onclick="reqSwap()">Send request</button><h3>My requests</h3><div id="sw"></div></section><section id="sup" class="tab card hide"><h2>Support – FAQs</h2><input id="fq" placeholder="Type your question…" oninput="faq()"><div id="fl"></div></section></div></main>
<script src="config.js"></script><script>
let U,S=[];
login('partner',init);
async function signup(){const{error}=await sb.auth.signUp({email:$('#em').value,password:$('#pw').value,options:{data:{org:$('#org').value}}});toast(error?error.message:'Account created – now log in (check email if asked to confirm)')}
async function init(u){U=u;const{data:pf}=await sb.from('profiles').select('logo_url').eq('id',u.id).single();if(pf?.logo_url){$('#pl').src=pf.logo_url;$('#pl').style.display=''}F=(await sb.from('faqs').select('*').order('id')).data||[];faq();$('#out').classList.remove('hide');await programOptions($('#prg'),'Select program');tabs(t=>{if(t!='reg')load()});
 $('#f').onsubmit=async e=>{e.preventDefault();const r=Object.fromEntries(new FormData(e.target));const{error}=await sb.from('students').insert(r);if(error)return toast(error.message);e.target.reset();toast('Registered! Status: Submitted');load()}}
async function load(){
 const{data}=await sb.from('students').select('*,programs(name)').order('created_at',{ascending:false});S=data||[];
 $('#ls').innerHTML=`<table><tr><th>Name</th><th>DTC ID</th><th>Program</th><th>Registered</th><th>Status</th><th>Final exam</th></tr>${S.map(s=>`<tr><td>${esc(s.name)}<br><small>${esc(s.email)}</small></td><td>${esc(s.dtc_id)}</td><td>${esc(s.programs?.name)}</td><td>${new Date(s.created_at).toLocaleDateString()}</td><td>${tag(s.status)}</td><td>${tag(s.final_exam)}</td></tr>`).join('')}</table>`;
 const o=S.map(s=>`<option value="${s.id}">${esc(s.name)} (${esc(s.dtc_id)})</option>`).join('');$('#ss').innerHTML=o;progress();
 const{data:w}=await sb.from('swaps').select('*,students(name)').order('created_at',{ascending:false});
 $('#sw').innerHTML=(w||[]).map(x=>`<p>${esc(x.students?.name)} → ${esc(x.new_name)} ${tag(x.status)}</p>`).join('')||'<p>None yet</p>'}
async function progress(){
 if(!S.length){$('#pd').innerHTML='<p>No students yet.</p>';return}
 const{data:P}=await sb.from('programs').select('*,courses(*,assessments(*))').in('id',[...new Set(S.map(s=>s.program_id))]);
 const{data:G}=await sb.from('grades').select('*').in('student_id',S.map(s=>s.id));const gm={};(G||[]).forEach(x=>gm[x.student_id+'-'+x.assessment_id]=x);
 $('#pd').innerHTML=S.map(s=>{const p=(P||[]).find(x=>x.id==s.program_id)||{courses:[]},st=new Date(s.created_at),en=new Date(st);en.setFullYear(st.getFullYear()+1);
 return`<div class="acc"><div class="hd" onclick="tg(this)"><span>${esc(s.name)} · ${esc(p.name)} ${tag(s.status)}</span><i>+</i></div><div class="bd"><p>DTC ID: ${esc(s.dtc_id)} · Start: <b>${st.toLocaleDateString()}</b> · End: <b>${en.toLocaleDateString()}</b> · Final exam: ${tag(s.final_exam)}</p><div class="ol">${fmt(p.outline)}</div>`+
 (p.courses.length?p.courses.map(k=>`<div class="acc"><div class="hd" onclick="tg(this)"><span>${esc(k.name)}</span><i>+</i></div><div class="bd"><div class="ol">${fmt(k.outline)}</div><table><tr><th>Assessment</th><th>Score</th><th>Grade</th></tr>${k.assessments.map(a=>{const r=gm[s.id+'-'+a.id];return`<tr><td>${esc(a.name)}</td><td>${r?.score??'–'} / ${a.max_score}</td><td>${esc(r?.grade||'Pending')}</td></tr>`}).join('')}</table></div></div>`).join(''):'<p>Courses will appear here once added.</p>')+'</div></div>'}).join('')}
let F=[];function faq(){const q=$('#fq').value.toLowerCase();$('#fl').innerHTML=F.filter(f=>(f.question+f.answer).toLowerCase().includes(q)).map(f=>`<div class="acc"><div class="hd" onclick="tg(this)"><span>${esc(f.question)}</span><i>+</i></div><div class="bd"><div class="ol">${fmt(f.answer)}</div></div></div>`).join('')||'<p>No match – please contact Fortune Academy support.</p>'}
async function reqSwap(){const{error}=await sb.from('swaps').insert({student_id:$('#ss').value,new_name:$('#sn').value,new_email:$('#se').value,new_phone:$('#sp').value,reason:$('#sr').value});toast(error?error.message:'Swap request sent');load()}
</script></body></html>
